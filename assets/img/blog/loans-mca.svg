<rect x="172" y="252" width="146" height="44" rx="10" fill="#fcf0f1"/>
<circle cx="194" cy="274" r="12" fill="#2fa84f"/><path d="M188 274l4.5 4.5 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="214" y="279" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="14" fill="#1a202c">Approved</text>
