<ellipse cx="420" cy="306" rx="54" ry="16" fill="#d98e1c"/><rect x="366" y="282" width="108" height="24" fill="#e9a028"/><ellipse cx="420" cy="282" rx="54" ry="16" fill="url(#gold)"/>
<rect x="366" y="258" width="108" height="24" fill="#e9a028"/><ellipse cx="420" cy="258" rx="54" ry="16" fill="url(#gold)"/>
<rect x="366" y="234" width="108" height="24" fill="#e9a028"/><ellipse cx="420" cy="234" rx="54" ry="16" fill="url(#gold)"/>
<rect x="366" y="210" width="108" height="24" fill="#e9a028"/><ellipse cx="420" cy="210" rx="54" ry="16" fill="url(#gold)"/>
</g>
<text x="420" y="217" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" fill="#b9741a">₹</text>
<!-- grad cap on coins -->
<path d="M420 150l70 28-70 28-70-28z" fill="#191e27"/><path d="M380 194v26c0 10 18 18 40 18s40-8 40-18v-26l-40 16z" fill="#2b3240"/>
